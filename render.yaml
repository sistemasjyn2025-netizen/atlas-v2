services:
  - type: web
    name: atlas-api
    env: node
    plan: free
    rootDir: .
    buildCommand: pnpm install && pnpm run build --filter=@atlas/api
    startCommand: node apps/atlas-api/dist/index.js
    envVars:
      - key: PNPM_VERSION
        value: 9.0.0
      - key: DATABASE_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
